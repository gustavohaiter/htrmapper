[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htrmapper"
version = "0.1.0"
description = "Aerial photogrammetry desktop software for precision agriculture, with correct PPK/RTK-weighted bundle adjustment."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pillow>=10.0",
    "piexif>=1.1.3",
    "pyproj>=3.6",
    "numpy>=1.26",
    "psutil>=5.9",
    "matplotlib>=3.8",
    "laspy>=2.5",
    "rasterio>=1.3",
    "scipy>=1.11",
    "reportlab>=4.0",
]

[project.optional-dependencies]
# Exactly one of cpu / cuda. They are kept out of the base dependencies on
# purpose: both install the same `pycolmap` module, and a base requirement on
# the CPU build would silently overwrite the CUDA build on every
# `pip install -e .` (the dense cloud then fails with "no GPU").
cpu = [
    "pycolmap>=4.0,<5",
]
cuda = [
    "pycolmap-cuda12>=4.0,<5",
]
gui = [
    "PySide6>=6.6",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
htrmapper = "htrmapper.cli.main:main"
htrmapper-gui = "htrmapper.gui.auto_window:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
